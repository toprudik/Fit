[extend]
useDefault = true

[allowlist]
description = "Public values that are safe by design"
regexes = [
  # Supabase publishable keys are meant for the browser (docs/adr/0001-supabase-backend.md)
  '''sb_publishable_[A-Za-z0-9_-]+''',
]
paths = [
  # Fake tokens used only in unit tests
  '''apps/web/src/lib/telegram/.*\.test\.ts''',
  '''apps/bot/tests/.*\.py''',
  '''apps/web/src/lib/auth/bearer\.test\.ts''',
  '''apps/web/src/app/api/calendar/\[token\]/route(\.security)?\.test\.ts''',
]
