name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull_request events gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are in the job log and summary; a SARIF artifact per run only adds storage.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Public values only; server secrets are not needed to build or test.
      NEXT_PUBLIC_APP_URL: https://fit.example
      NEXT_PUBLIC_SUPABASE_URL: https://zxwabddqqtitybtsdeqp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.*') }}
          restore-keys: next-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm run build
      - name: First-load JS budget (docs/prd/quality.md)
        run: node scripts/perf-budget.mjs

  # 500 browser tests take six minutes on one runner and decide how long CI takes, so they run in
  # three parallel shards. `web-e2e` keeps the check's name and passes only if every shard passed.
  web-e2e-shard:
    name: web-e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_APP_URL: https://fit.example
      NEXT_PUBLIC_SUPABASE_URL: https://zxwabddqqtitybtsdeqp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.*') }}
          restore-keys: next-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm run build
      # Every screen at 390 and 1280 px in both themes: axe (WCAG 2.2 AA), tabs, language, theme.
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: |
            apps/web/e2e/screenshots
            apps/web/playwright-report
          retention-days: 7

  web-e2e:
    runs-on: ubuntu-latest
    needs: web-e2e-shard
    if: always()
    steps:
      - name: Every e2e shard passed
        run: test "${{ needs.web-e2e-shard.result }}" = success

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  db:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0 # the action's default is 2.20.3; bump on purpose, never "latest"
      - name: Start Postgres and apply every migration from scratch
        id: db
        run: supabase db start
      - name: pgTAP tests (RLS matrix, triggers, constraints)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: supabase test db
      - name: plpgsql_check
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: supabase db lint --local --schema public,private --fail-on error
      - name: Security advisors
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: supabase db advisors --local --type security --fail-on warn
      # One permissive policy per action (contract R88), so no warning is filtered out here.
      - name: Performance advisors
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: supabase db advisors --local --type performance --fail-on warn
      - name: Generated database types are committed and current
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u apps/web/src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=apps/web/src/lib/supabase/database.types.ts::Out of date. Run: supabase gen types typescript --local > apps/web/src/lib/supabase/database.types.ts"
            exit 1
          fi

  # Runs alongside the other jobs instead of after web and bot: waiting added three minutes to every run.
  docker:
    runs-on: ubuntu-latest
    env:
      # build-push-action uploads a build record artifact per image by default (kept 90 days); nobody reads them.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://fit.example
            NEXT_PUBLIC_SUPABASE_URL=https://zxwabddqqtitybtsdeqp.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: apps/bot
          push: false
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
