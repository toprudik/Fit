name: CI

# Minutes on a private repo are billed per job, each rounded up to a whole minute, so everything that does not
# need Docker runs as one job and skips the parts of the repo a PR does not touch. Browser tests run only on PRs
# labelled `e2e`: add the label once a PR is ready to merge (draft PRs need a paid plan on private repos).
# main is not re-checked after a merge: the PR already was.
# The database checks live in ci-database.yml, the Docker image builds in ci-docker.yml (both path-filtered).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Adding any other label is not a reason to run the checks again.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull_request events gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    env:
      # Public values only; server secrets are not needed to build or test.
      NEXT_PUBLIC_APP_URL: https://fit.example
      NEXT_PUBLIC_SUPABASE_URL: https://zxwabddqqtitybtsdeqp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Which apps changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "bot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$files"
          if echo "$files" | grep -qE '^(apps/web/|\.github/workflows/ci\.yml$)'; then echo "web=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(apps/bot/|\.github/workflows/ci\.yml$)'; then echo "bot=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.changed.outputs.bot == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Bot checks
        if: steps.changed.outputs.bot == 'true'
        working-directory: apps/bot
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm ci
      - if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm run lint
      - if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm run typecheck
      - if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm test
      - if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: npm run build

      # Every screen at 390 and 1280 px in both themes: axe (WCAG 2.2 AA), tabs, language, theme.
      # Reuses the build above. Run on PRs labelled `e2e` and on manual runs.
      - name: Install Chromium
        id: e2e
        if: steps.changed.outputs.web == 'true' && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e'))
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - if: steps.e2e.outcome == 'success'
        working-directory: apps/web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        with:
          name: e2e-screenshots
          path: |
            apps/web/e2e/screenshots
            apps/web/playwright-report
          retention-days: 14
