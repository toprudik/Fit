name: CI

# The repository is private, so Actions minutes are billed per job, each rounded up to a whole minute
# (GitHub Pro: 3000 a month). Everything that needs no Docker runs as one job and skips the apps a PR does not
# touch. Browser tests and Lighthouse run only on PRs labelled `e2e`: add the label last, once the PR is
# otherwise green, because every later push repeats them. main is not re-checked after a merge: the PR was.
# Database checks: ci-database.yml, Docker images: ci-docker.yml (both only when their files change).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Another label gets a group of its own, so adding it does not cancel a run in progress.
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e' && '-label' || '' }}
  cancel-in-progress: true

jobs:
  checks:
    # Another label is not a reason to run everything again.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # On pull_request events gitleaks-action lists the PR's commits through the API.
      pull-requests: read
    env:
      # Public values only; server secrets are not needed to build or test.
      NEXT_PUBLIC_APP_URL: https://fit.example
      NEXT_PUBLIC_SUPABASE_URL: https://zxwabddqqtitybtsdeqp.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are in the job log and summary; a SARIF artifact per run only adds storage.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Which apps changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          E2E: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          if [ -z "$BASE_REF" ]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          fi
          if grep -qE '^(apps/web/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "web=true" >>"$GITHUB_OUTPUT"
            echo "e2e=$E2E" >>"$GITHUB_OUTPUT"
          fi
          if grep -qE '^(apps/bot/|\.github/workflows/ci\.yml$)' <<<"$files"; then echo "bot=true" >>"$GITHUB_OUTPUT"; fi

      - if: steps.changed.outputs.bot == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - name: Bot checks
        if: steps.changed.outputs.bot == 'true'
        working-directory: apps/bot
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web checks
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - if: steps.changed.outputs.web == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.*') }}
          restore-keys: next-${{ hashFiles('apps/web/package-lock.json') }}-
      - name: Web build and first-load JS budget (docs/prd/quality.md)
        if: steps.changed.outputs.web == 'true'
        working-directory: apps/web
        run: |
          npm run build
          node scripts/perf-budget.mjs

      # Every screen at 390 and 1280 px in both themes: axe (WCAG 2.2 AA), tabs, language, theme. Reuses the build.
      - name: Install Chromium
        id: e2e
        if: steps.changed.outputs.e2e == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: steps.e2e.outcome == 'success'
        working-directory: apps/web
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        with:
          name: e2e-screenshots
          path: |
            apps/web/e2e/screenshots
            apps/web/playwright-report
          retention-days: 7
      # Lighthouse mobile on public pages (lighthouserc.json); help and the zones need a signed-in user.
      # Warns only for now: once it has run quietly for two weeks, drop continue-on-error and set the
      # assertions to "error". The is-crawlable audit is skipped: public/robots.txt closes the whole site
      # during the beta. `next start` checks server secrets at boot, so it gets obvious fakes.
      - name: Lighthouse (docs/prd/quality.md)
        if: ${{ !cancelled() && steps.e2e.outcome == 'success' }}
        working-directory: apps/web
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ci-placeholder
          TELEGRAM_BOT_TOKEN: "1:ci-placeholder"
          TELEGRAM_LOGIN_CLIENT_ID: ci-placeholder
          TELEGRAM_LOGIN_CLIENT_SECRET: ci-placeholder
        run: |
          npx --yes @lhci/cli@0.15.1 autorun
          node scripts/lighthouse-summary.mjs >>"$GITHUB_STEP_SUMMARY"
