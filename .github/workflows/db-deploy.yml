name: Database deploy

# Applies supabase/migrations to the hosted project "fit" (ref zxwabddqqtitybtsdeqp) once they land on main,
# then runs the Supabase advisors against it. The only input is the repository secret SUPABASE_DB_URL: the
# Session pooler connection string from the Supabase dashboard (Connect → Session pooler), password
# percent-encoded. GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host does not work here.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'toprudik/Fit'
    runs-on: ubuntu-latest
    environment: supabase-fit
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - name: Check the connection secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set in the environment supabase-fit (Supabase dashboard → Connect → Session pooler)."
            exit 1
          fi
      # No --include-all on purpose: threads often redefine the same function in separate migrations, so applying
      # an older file after a newer one could leave production on the older definition while CI and local
      # databases (which apply in timestamp order) have the newer one. An out-of-order file is renamed instead.
      - name: Migrations that will be applied
        shell: bash
        run: |
          if ! supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.log"; then
            if grep -q "inserted before the last migration" "$RUNNER_TEMP/dry-run.log"; then
              echo "::error::A migration listed above is older than the last one already applied in production, so it was not applied. Open a PR that renames it to a timestamp later than the newest file in supabase/migrations (scripts/check-migration-order.sh suggests one); merging it re-runs this deploy."
            fi
            exit 1
          fi
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault --yes
      # The schema already passes the advisors at warn level in CI (job "db"). Here they also see the hosted
      # project's own settings (e.g. leaked password protection, which DaFit does not use: sign-in is Telegram
      # only), so only errors fail the deploy and warnings stay in the log.
      - name: Security advisors
        run: supabase db advisors --db-url "$SUPABASE_DB_URL" --type security --fail-on error
      - name: Performance advisors
        run: supabase db advisors --db-url "$SUPABASE_DB_URL" --type performance --fail-on error
