name: CI docker

# Builds the self-hosting images (docker-compose.prod.yml) only when a PR changes what goes into them
# (Actions minutes are billed, see ci.yml).

on:
  pull_request:
    paths:
      - "apps/*/Dockerfile"
      - "apps/*/.dockerignore"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/web/next.config.*"
      - "apps/bot/pyproject.toml"
      - "apps/bot/uv.lock"
      - "docker-compose*.yml"
      - ".github/workflows/ci-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # build-push-action uploads a build record artifact per image by default (kept 90 days); nobody reads them.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/web
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://fit.example
            NEXT_PUBLIC_SUPABASE_URL=https://zxwabddqqtitybtsdeqp.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build bot image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/bot
          push: false
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
