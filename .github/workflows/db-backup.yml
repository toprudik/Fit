name: Database backup

# Nightly copy of the hosted database (project "fit"), because the Supabase free plan keeps none. Runs only when
# called from the PRIVATE backup repository (its workflow does `uses: toprudik/Fit/.github/workflows/db-backup.yml@main`
# on a schedule), never in this public repository: here anyone signed in to GitHub could download and keep the
# artifact, so a 7-day retention would mean nothing. The run, its secrets and the artifact all belong to the caller.
# The copy is encrypted on the runner with DB_BACKUP_PASSPHRASE before it is stored; without it the copy cannot be
# opened. Kept 7 days, as Supabase Pro would. Each run also restores the copy into an empty local Supabase and checks
# the row counts, so a copy that cannot be restored turns the run red. Storage files (uploads) are not in the copy.
# Restore by hand: scripts/db-backup/restore.sh. The caller's workflow: scripts/db-backup/private-repo-workflow.yml.

on:
  workflow_call:
    secrets:
      SUPABASE_DB_URL:
        description: Session pooler connection string (Supabase dashboard → Connect → Session pooler).
        required: true
      DB_BACKUP_PASSPHRASE:
        description: Passphrase the copy is encrypted with, one line of at least 20 characters.
        required: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
            echo "::error::$GITHUB_REPOSITORY is not private, so its artifacts are public. Call this workflow only from the private backup repository."
            exit 1
          fi
      # The scripts come from this repository; the caller's checkout would not have them. Same ref as the caller's @main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: toprudik/Fit
          ref: main
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - name: Check the secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set (Supabase dashboard → Connect → Session pooler)."
            exit 1
          fi
          # gpg reads only the first line of the passphrase, so a second line would silently not count.
          case "$DB_BACKUP_PASSPHRASE" in
            *$'\n'* | *$'\r'*)
              echo "::error::Secret DB_BACKUP_PASSPHRASE contains a line break; it must be one line."
              exit 1
              ;;
          esac
          if [ "${#DB_BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Secret DB_BACKUP_PASSPHRASE is missing or shorter than 20 characters."
            exit 1
          fi
      - name: Make the encrypted copy
        id: copy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          name="dafit-db-$(date -u +%Y-%m-%d)"
          scripts/db-backup/backup.sh "$RUNNER_TEMP/backup/$name.tar.gpg"
          echo "name=$name" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.copy.outputs.name }}
          path: ${{ runner.temp }}/backup/${{ steps.copy.outputs.name }}.tar.gpg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # An empty project: this repository's Supabase config without its migrations, as a new hosted project would be.
      - name: Start an empty Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/restore/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/restore/supabase/"
          supabase start --workdir "$RUNNER_TEMP/restore" \
            -x studio,edge-runtime,logflare,vector,supavisor,mailpit,realtime,imgproxy,postgrest,postgres-meta
      - name: Restore the copy and compare row counts
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          image=$(docker ps --filter name=supabase_db_ --format '{{.Image}}' | head -n 1)
          PSQL="docker run --rm -i --network host --entrypoint psql $image" \
            scripts/db-backup/restore.sh "$RUNNER_TEMP/backup/${{ steps.copy.outputs.name }}.tar.gpg" \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
