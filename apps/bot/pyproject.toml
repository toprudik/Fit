[project]
name = "fit-bot"
version = "0.1.0"
description = "Fit Telegram bot (aiogram)"
requires-python = ">=3.13"
dependencies = [
  "aiogram==3.31.0",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_bot"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
