[project]
name = "fit-bot"
version = "0.1.0"
description = "DaFit Telegram bot (aiogram)"
requires-python = ">=3.13"
dependencies = [
  "aiogram==3.31.0",
  "aiohttp>=3.12,<4", # imported directly (setup probes, self-hosted server); the lock keeps 3.14.5
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "uvicorn>=0.35", # the HTTP smoke test serves the ASGI app the way Vercel does
]

[build-system]
# Pinned: the build backend is not in uv.lock, and Vercel builds the package with production variables present.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fit_bot"]

# Vercel project dafit-bot (Root Directory apps/bot) serves this ASGI app. See docs/adr/0006.
[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
